name: Verify published evidence
on:
  pull_request:
  push:
    branches: [main]
jobs:
  reproduce-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python verify_evidence.py
      - run: python -m unittest -v test_evidence
